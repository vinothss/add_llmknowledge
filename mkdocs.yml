site_name: Adding Knowledge to LLMs
site_url: https://vinothss.github.io/add_llmknowledge/
site_description: Self-paced, hands-on workshop - curate data, evaluate, customise (CPT / SFT / DPO) and optimise LLMs on Google Colab.
repo_url: https://github.com/vinothss/add_llmknowledge
repo_name: vinothss/add_llmknowledge
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    logo: material/brain

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Modules:
      - 1. Data curation & synthetic data: modules/01-data-curation.md
      - 2. Evaluating LLMs: modules/02-evaluation.md
      - 3. Customising LLMs (CPT, SFT, DPO): modules/03-customization.md
      - 4. Optimising for deployment: modules/04-optimization.md
      - 5. Assessment - Safety alignment with DPO: modules/05-assessment.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/portal.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
